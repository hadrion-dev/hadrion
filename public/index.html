<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HADRION</title>
  <link rel="stylesheet" href="./css/base.css?v=3">
  <link rel="stylesheet" href="./css/sidebar.css?v=3">
  <link rel="stylesheet" href="./css/chat.css?v=3">
  <link rel="stylesheet" href="./css/composer.css?v=3">
  <link rel="stylesheet" href="./css/topbar.css?v=3">
</head>
<body>

  <div id="app">

    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>HADRION</h1>
        <button id="btn-sidebar-close" aria-label="Menú">☰</button>
      </div>

      <button id="btn-nuevo-chat" class="btn-primario">+ New chat</button>

      <nav class="sidebar-nav">
        <button class="sidebar-item" data-seccion="biblioteca">Library</button>
        <button class="sidebar-item" data-seccion="imagenes">Images</button>
        <button class="sidebar-item" data-seccion="video">Video</button>
      </nav>

      <div class="sidebar-todos">
        <div class="sidebar-titulo">All</div>
        <div id="lista-chats"></div>
      </div>

      <div class="sidebar-footer">
        <button id="btn-ajustes" aria-label="Ajustes">⚙</button>
        <div id="avatar-usuario">H</div>
      </div>
    </aside>

    <main id="main">

      <div id="topbar">
        <div class="topbar-left">
          <button id="btn-sidebar-open" aria-label="Abrir menú">☰</button>
                  </div>
        <button id="btn-tts" aria-label="Leer en voz alta">🔇</button>
      </div>

      <div id="msgs">
        <div id="msgs-inner">
          <div id="welcome">
            <div class="welcome-big">Hello 👋</div>
            <div class="welcome-sub">How can I help you today?</div>
          </div>
        </div>
      </div>

      <div id="composer">
        <div id="composer-inner">

          <div id="preview-adjunto" hidden>
            <img id="preview-img" alt="">
            <span id="preview-nombre"></span>
            <button id="btn-preview-quitar" aria-label="Quitar imagen">×</button>
          </div>

          <div id="fila-input">
            <button id="btn-adjuntar" aria-label="Adjuntar imagen">+</button>
            <textarea id="input-mensaje" rows="1" placeholder="Send a message..."></textarea>
            <button id="btn-modelo" title="Escoger modelo" aria-label="Escoger modelo">▼</button>
            <button id="btn-micro" aria-label="Dictar por voz">🎤</button>
            <button id="btn-enviar" disabled>Send</button>
          </div>

        </div>
      </div>

    </main>

  </div>

  <input type="file" id="input-archivo" accept="image/*" hidden>

  <script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
